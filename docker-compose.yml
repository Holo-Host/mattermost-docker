# https://docs.docker.com/compose/environment-variables/
name: holo-mm

services:
  mattermost:
    container_name: mattermost
    build:
      context: .
      args:
        - MATTERMOST_IMAGE_TAG=${MATTERMOST_IMAGE_TAG}
      network: host
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    volumes:
      - ${MATTERMOST_CONFIG_PATH}:/mattermost/config:rw
      - ${MATTERMOST_DATA_PATH}:/mattermost/data:rw
      - ${MATTERMOST_LOGS_PATH}:/mattermost/logs:rw
      - ${MATTERMOST_PLUGINS_PATH}:/mattermost/plugins:rw
      - ${MATTERMOST_CLIENT_PLUGINS_PATH}:/mattermost/client/plugins:rw
      - ${MATTERMOST_BLEVE_INDEXES_PATH}:/mattermost/bleve-indexes:rw
      - ./resolv.conf:/etc/resolv.conf:ro 
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: /usr/local/bin/entrypoint.sh 
    restart: ${RESTART_POLICY}
    cap_drop:
      - NET_RAW
      - SYS_CHROOT
    cap_add:
      - NET_ADMIN 
    pids_limit: 200
    read_only: ${MATTERMOST_CONTAINER_READONLY}
    runtime: sysbox-runc
    tmpfs:
      - /tmp
    networks:
      - mattermost-network

  postgres:
    container_name: postgres
    image: postgres:${POSTGRES_IMAGE_TAG}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    environment:
      # timezone inside container
      - TZ

      # necessary Postgres options/variables
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    restart: ${RESTART_POLICY}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s # Was 2s
      timeout: 10s # Was 5s
      retries: 20 # Was 10
    cap_drop:
      - NET_RAW
      - SYS_CHROOT
    pids_limit: 100
    pull_policy: if_not_present
    read_only: true
      #    security_opt:
      #      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - mattermost-network

networks:
  # This network name is also being used for Let's Encrypt certificate renewal
  mattermost-network: # Define the custom network (correctly)
    driver: bridge
    # Optional: If you need external access, set external: true
    # external: true
